name: Atlas science and browser checks
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Full delivery check or browser regression checks with exact rebuild'
        required: true
        default: full
        type: choice
        options:
          - full
          - browser
run-name: Atlas ${{ inputs.scope || 'full' }} checks
permissions:
  contents: read
concurrency:
  group: atlas-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  atlas-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Install the hashed scientific environment
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-jury.lock
      - name: Install the locked browser environment
        run: |
          npm ci --prefix tools/browser
          node tools/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run all required scientific, rebuild and real browser checks
        if: ${{ inputs.scope != 'browser' }}
        run: python -B -X utf8 run_all.py --output artifacts/jury-check
      - name: Check scientific bytes, exact rebuild and all real browser scenarios
        if: ${{ inputs.scope == 'browser' }}
        run: |
          python -B -X utf8 -m scripts.verify_delivery
          python -B -X utf8 -m scripts.verify_delivery --rebuild
          node tests/browser/main_model_controls.cjs .
          python -B -X utf8 -m scripts.check_browser_delivery
      - name: Exercise the portable synthetic runner on two small fixtures
        if: ${{ !cancelled() && inputs.scope != 'browser' }}
        shell: bash
        run: |
          set -euo pipefail
          atlas_runtime="$(python -c 'import json,pathlib; files=sorted(pathlib.Path("artifacts/jury-check").glob("*/summary.json")); print(json.loads(files[-1].read_text())["runtime_copy"]["root"])')"
          cd "$atlas_runtime"
          python -B -X utf8 -m scripts.reproduce_synthetic --output "$GITHUB_WORKSPACE/artifacts/synthetic-ci-fixture" --fixture
      - name: Confirm the delivered source stayed unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlas-check-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            artifacts/jury-check/
            !artifacts/jury-check/**/tmp/**
            artifacts/synthetic-ci-fixture/
            artifacts/browser-delivery/
