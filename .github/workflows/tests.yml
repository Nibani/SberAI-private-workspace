name: Private jury and atlas checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-jury-${{ github.ref }}
  cancel-in-progress: false
jobs:
  jury-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Install the scientific dependencies
        run: python -m pip install -r requirements-models.txt
      - name: Complete main scientific and unit checks
        run: python -B -X utf8 run_all.py --output artifacts/jury-check
      - name: Rebuild the exact current atlas
        run: |
          python -B -X utf8 -m scripts.render_saved_atlas --output artifacts/ci-rebuild/index.html
          cmp artifacts/ci-rebuild/index.html docs/index.html
          for asset in artifacts/ci-rebuild/assets/*; do
            cmp "$asset" "docs/assets/$(basename "$asset")"
          done
          git diff --exit-code
      - name: Install the pinned browser
        run: |
          npm install --prefix artifacts/ci-node --no-save --package-lock=false playwright@1.62.1
          node artifacts/ci-node/node_modules/playwright/cli.js install --with-deps chromium
      - name: Real V3 interaction on a private runner
        shell: bash
        env:
          TEST_BASE_URL: http://127.0.0.1:8765/docs/index.html
          PLAYWRIGHT_PATH: ${{ github.workspace }}/artifacts/ci-node/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui
          python -m http.server 8765 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" > artifacts/ui/server.log 2>&1 &
          atlas_server_pid=$!
          trap 'kill "$atlas_server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$TEST_BASE_URL" --output /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node tests/browser/main_model_regressions.cjs docs/index.html artifacts/ui > artifacts/ui/main.log 2>&1
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-v3-check-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            artifacts/jury-check/
            artifacts/ci-rebuild/
            artifacts/ui/
